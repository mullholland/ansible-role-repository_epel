---
# ansible.builtin.rpm_key shells out to gpg/gpg2 to inspect the key, and its
# behavior is inconsistent across GnuPG versions (e.g. EL10 ships GnuPG 2.4.5,
# which emits "packet(6) with unknown version 6" through some ansible-core
# releases). Importing directly via rpm sidesteps the module entirely.
- name: "epel | Check if imported GPG key: epel{{ repository_epel_version }}"  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: rpm -q gpg-pubkey --qf "%{summary}\n"
  register: repository_epel_gpg_keys
  changed_when: false

- name: epel | Import EPEL GPG key  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "rpm --import {{ repository_epel_key_url }}"
  when: "'epel' ~ repository_epel_version not in repository_epel_gpg_keys.stdout"
  register: result
  until: result is succeeded
  retries: 5
  delay: 10
  changed_when: true

- name: epel | Check enabled repositories  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: dnf repolist --enabled
  register: repository_epel_enabled_repos
  changed_when: false
  when:
    - repository_epel_crb_enable | bool
    - ansible_facts['distribution'] in ["CentOS", "Rocky", "AlmaLinux"]
    - ansible_facts['distribution_major_version'] | int >= 9

- name: epel | CentOS/Rocky/AlmaLinux 9+ | Enable CRB repository
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled crb
  changed_when: true
  when:
    - repository_epel_crb_enable | bool
    - ansible_facts['distribution'] in ["CentOS", "Rocky", "AlmaLinux"]
    - ansible_facts['distribution_major_version'] | int >= 9
    - "'crb' not in repository_epel_enabled_repos.stdout"

- name: epel | Install EPEL repository
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
    disable_gpg_check: true
  with_items:
    - "{{ repository_epel_packages[ansible_facts['distribution']][ansible_facts['distribution_major_version']] }}"
